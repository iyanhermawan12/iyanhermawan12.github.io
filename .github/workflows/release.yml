name: Publish to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Inject
        env:
          AC79A4: ${{ secrets.AC79A4 }}
          B05211: ${{ secrets.B05211 }}
        run: |
          python3 -c "
          import pathlib, os, sys
          sec_a = os.environ.get('AC79A4', '')
          sec_b = os.environ.get('B05211', '')
          target = pathlib.Path('index.html')
          before = target.read_text(encoding='utf-8')
          after = before
          if sec_a:
              after = after.replace('<!-- 89bef539f8f0548d5eb52e4dc573d5 -->', sec_a)
          if sec_b:
              after = after.replace('<!-- dac78f59855f4955031ceb56c7c6118855f7b1b9e7 -->', sec_b)
          if after == before and (sec_a or sec_b):
              sys.exit(1)
          if after != before:
              target.write_text(after, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
